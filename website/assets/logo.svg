<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141A" />
      <stop offset="100%" stop-color="#060608" />
    </linearGradient>

    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34C759" />
      <stop offset="100%" stop-color="#248A3D" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bg)" stroke="url(#rim)" stroke-width="2.5" />

  <!-- Hardware Notch Island -->
  <rect x="104" y="196" width="304" height="120" rx="60" fill="#020204" stroke="#22222A" stroke-width="3" />

  <!-- Emerald Live Indicator -->
  <circle cx="172" cy="256" r="16" fill="url(#accent)" filter="url(#glow)" />

  <!-- Harmonic Audio Equalizer Spectrum -->
  <rect x="246" y="238" width="12" height="36" rx="6" fill="#FFFFFF" fill-opacity="0.95" />
  <rect x="274" y="220" width="12" height="72" rx="6" fill="#34C759" filter="url(#glow)" />
  <rect x="302" y="232" width="12" height="48" rx="6" fill="#FFFFFF" fill-opacity="0.8" />
  <rect x="330" y="244" width="12" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.45" />
</svg>
